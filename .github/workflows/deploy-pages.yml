# Builds the site as static files and publishes it to GitHub Pages
# on every push to master (or when run by hand from the Actions tab).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Served at https://veltrix-intelligence.github.io/VELTRIX-Website/
          # Clear this if a custom domain is added.
          NEXT_PUBLIC_BASE_PATH: /VELTRIX-Website
          # Set under Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_FORMSPREE_ID: ${{ vars.FORMSPREE_ID }}
        run: npx next build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
